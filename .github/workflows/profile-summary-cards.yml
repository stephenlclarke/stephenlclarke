---
name: Update profile summary cards

"on":
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-summary-cards.yml

permissions:
  contents: write

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when METRICS_TOKEN is missing
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "METRICS_TOKEN is not set; skipping summary card generation."

      - name: Generate summary cards
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: vn7n24fzkq/github-profile-summary-cards@4a9822e91a20eae650b9591769569976f0d578ba  # yamllint disable-line rule:line-length
        env:
          GITHUB_TOKEN: ${{ env.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: "1"
          AUTO_PUSH: false
          THEME: default
          ANIMATION: none

      - name: Verify generated summary cards
        if: ${{ env.METRICS_TOKEN != '' }}
        run: |
          set -euo pipefail
          for card in \
            1-repos-per-language.svg \
            2-most-commit-language.svg \
            3-stats.svg \
            4-productive-time.svg; do
            test -s "profile-summary-card-output/default/$card"
          done

      - name: Commit generated summary cards
        if: ${{ env.METRICS_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.email "$bot_email"
          git add profile-summary-card-output/default
          if git diff --cached --quiet; then
            echo "No summary card changes to commit."
            exit 0
          fi
          git commit \
            -m "chore: update profile summary cards [skip ci]"
          git push
